quarkus.http.host=127.0.0.1
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.username=${POSTGRES_USER}
quarkus.datasource.password=${POSTGRES_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://127.0.0.1:5433/${POSTGRES_DB}
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.flyway.migrate-at-start=true
%dev.quarkus.flyway.locations=db/migration,db/demo
%test.quarkus.flyway.locations=db/migration,db/demo
%test.quarkus.flyway.schemas=travel_buddy_test
%test.quarkus.hibernate-orm.database.default-schema=travel_buddy_test

# Private auth settings: production cookie defaults must stay secure.
auth.cookie-name=__Host-session
auth.cookie-secure=true
auth.frontend-url=${AUTH_FRONTEND_URL}
%dev.auth.frontend-url=http://localhost:3000
%test.auth.frontend-url=http://localhost:3000
%dev.auth.cookie-name=session
%dev.auth.cookie-secure=false
%test.auth.cookie-name=session
%test.auth.cookie-secure=false
quarkus.rest-csrf.create-token-path=/api/v1/auth/csrf
quarkus.rest-csrf.token-size=32
quarkus.rest-csrf.cookie-name=__Host-csrf
quarkus.rest-csrf.cookie-force-secure=true
%dev.quarkus.rest-csrf.cookie-name=csrf-token
%dev.quarkus.rest-csrf.cookie-force-secure=false
%test.quarkus.rest-csrf.cookie-name=csrf-token
%test.quarkus.rest-csrf.cookie-force-secure=false
# Keep true: JSON without a token header MUST NOT bypass verification.
quarkus.rest-csrf.require-form-url-encoded=true
quarkus.http.proxy.proxy-address-forwarding=false
quarkus.http.limits.max-body-size=16K
quarkus.mailer.from=no-reply@travel-buddy.test
quarkus.mailer.host=127.0.0.1
quarkus.mailer.port=1025
%dev.quarkus.mailer.mock=false
%test.quarkus.mailer.mock=true
quarkus.log.category."io.quarkus.mailer".level=ERROR
quarkus.log.category."io.quarkus.csrf".level=WARN
# MockMailbox otherwise prints reset links at INFO during tests.
quarkus.log.category."quarkus-mailer".level=ERROR

# Google is opt-in. The default tenant protects only explicitly authenticated endpoints.
auth.google.enabled=${GOOGLE_OIDC_ENABLED:false}
quarkus.oidc.tenant-enabled=${auth.google.enabled}
quarkus.oidc.devservices.enabled=false
quarkus.oidc.application-type=web-app
quarkus.oidc.auth-server-url=https://accounts.google.com
quarkus.oidc.client-id=${GOOGLE_OIDC_CLIENT_ID:disabled}
quarkus.oidc.credentials.secret=${GOOGLE_OIDC_CLIENT_SECRET:disabled}
quarkus.oidc.authentication.redirect-path=${GOOGLE_OIDC_REDIRECT_URI:http://localhost:3000/api/v1/auth/google/callback}
quarkus.oidc.authentication.scopes=openid,email,profile
quarkus.oidc.authentication.nonce-required=true
quarkus.oidc.authentication.pkce-required=true
quarkus.oidc.authentication.restore-path-after-redirect=false
quarkus.oidc.authentication.remove-redirect-parameters=false
quarkus.oidc.authentication.error-path=${auth.frontend-url}/api/v1/auth/google/error
quarkus.oidc.authentication.state-cookie-age=10M
quarkus.oidc.authentication.allow-multiple-code-flows=true
quarkus.oidc.token.issuer=https://accounts.google.com
quarkus.oidc.token.audience=${GOOGLE_OIDC_CLIENT_ID:disabled}
quarkus.oidc.token.lifespan-grace=0
quarkus.oidc.authentication.user-info-required=false
quarkus.log.category."io.quarkus.oidc".level=OFF
quarkus.log.category."org.hibernate.orm.jdbc.error".level=OFF
quarkus.oidc.authentication.cookie-force-secure=${auth.cookie-secure}

# Tests must never depend on local Google credentials.
%test.auth.google.enabled=false
