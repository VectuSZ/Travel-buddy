quarkus.http.host=127.0.0.1
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.username=${POSTGRES_USER}
quarkus.datasource.password=${POSTGRES_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://127.0.0.1:5433/${POSTGRES_DB}
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.flyway.migrate-at-start=true
%dev.quarkus.flyway.locations=db/migration,db/demo
%test.quarkus.flyway.locations=db/migration,db/demo
%test.quarkus.flyway.schemas=travel_buddy_test
%test.quarkus.hibernate-orm.database.default-schema=travel_buddy_test
