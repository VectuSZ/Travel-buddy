openapi: 3.0.3
info:
  title: Travel Buddy — profile API (stage 3)
  version: 1.0.0
  description: Additive specification for profiles. Auth and trips are documented in README. All responses use Cache-Control private, no-store. Writes also validate Origin against the trusted frontend URL.
servers:
  - url: http://localhost:3000/api/v1
paths:
  /me:
    get:
      security: [{session: []}]
      responses:
        '200':
          description: Current active user only; profile may not exist. Contacts are never copied from the login email.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Problem'}
  /me/profile:
    patch:
      security: [{session: [], csrf: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfilePatch'}
      responses:
        '200':
          description: Saved profile and current private account state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409':
          description: PROFILE_VERSION_CONFLICT. Keep the draft; explicitly reload before retrying.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /me/contacts:
    put:
      security: [{session: [], csrf: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Contacts'}
      responses:
        '200':
          description: Full replacement; omitted, blank or null fields are removed. Empty set is allowed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /profiles/{id}:
    get:
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Explicit public allowlist. No contacts or account email.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicProfile'}
        '404': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
      description: Local cookie; production uses __Host-session.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: Obtain token and matching HttpOnly cookie from GET /auth/csrf. Send with writes and same-origin browser request.
  responses:
    Problem:
      description: Stable code; client translates it. Validation codes INVALID_INPUT, INVALID_VERSION, INVALID_DISPLAY_NAME, INVALID_AGE, INVALID_BIO, INVALID_LANGUAGES, INVALID_TRAVEL_STYLES, INVALID_CONTACT_EMAIL, INVALID_INSTAGRAM, INVALID_WHATSAPP. Auth errors UNAUTHENTICATED, CSRF_INVALID, ORIGIN_REJECTED; public missing or inactive profile PROFILE_NOT_FOUND.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      required: [type, status, code]
      properties:
        type: {type: string}
        status: {type: integer}
        code: {type: string}
    Languages:
      type: array
      minItems: 1
      maxItems: 32
      description: Deduplicated, at most 10 unique values. Input capped at 32 entries.
      items:
        type: string
        enum: [pl, en, de, fr, es, it, pt, uk, cs, sk, nl, sv, 'no', da, fi, el, tr, ar, zh, ja, ko, hi]
    Styles:
      type: array
      minItems: 1
      maxItems: 32
      description: Deduplicated, at most 4 unique styles.
      items: {type: string, enum: [backpacking, comfort, trekking, city_break]}
    ProfilePatch:
      type: object
      additionalProperties: false
      required: [version]
      description: First save also requires displayName, age, languages, travelStyles. Subsequent omissions preserve values; required fields cannot be null. Text is trimmed; angle brackets are rejected. version 0 creates, subsequent writes use the returned version (starting at 1).
      properties:
        version: {type: integer, minimum: 0}
        displayName: {type: string, minLength: 2, maxLength: 60}
        age: {type: integer, minimum: 18, maximum: 120}
        bio: {type: string, nullable: true, maxLength: 1000}
        languages: {$ref: '#/components/schemas/Languages'}
        travelStyles: {$ref: '#/components/schemas/Styles'}
    Contacts:
      type: object
      additionalProperties: false
      properties:
        contactEmail: {type: string, format: email, nullable: true, maxLength: 254}
        instagramHandle:
          type: string
          nullable: true
          maxLength: 31
          description: Input may have one leading @, removed before storage. Stored value has at most 30 ASCII letters, digits, dots or underscores. Blank input clears the value.
        whatsappE164:
          type: string
          nullable: true
          maxLength: 16
          description: Blank clears; otherwise + followed by 2–15 digits, first digit nonzero. Format validation does not verify ownership or existence.
    PublicProfile:
      type: object
      additionalProperties: false
      required: [userId, displayName, age, bio, languages, travelStyles]
      properties:
        userId: {type: string, format: uuid}
        displayName: {type: string}
        age: {type: integer}
        bio: {type: string, nullable: true}
        languages: {$ref: '#/components/schemas/Languages'}
        travelStyles: {$ref: '#/components/schemas/Styles'}
    OwnProfile:
      type: object
      nullable: true
      additionalProperties: false
      required: [displayName, age, ageUpdatedAt, bio, languages, travelStyles, version]
      properties:
        displayName: {type: string}
        age: {type: integer}
        ageUpdatedAt: {type: string, format: date}
        bio: {type: string, nullable: true}
        languages: {$ref: '#/components/schemas/Languages'}
        travelStyles: {$ref: '#/components/schemas/Styles'}
        version: {type: integer}
    Me:
      type: object
      additionalProperties: false
      required: [userId, email, profile, contacts, profileComplete, hasContact, readyToParticipate]
      properties:
        userId: {type: string, format: uuid}
        email: {type: string, format: email}
        profile: {$ref: '#/components/schemas/OwnProfile'}
        contacts: {$ref: '#/components/schemas/Contacts'}
        profileComplete: {type: boolean}
        hasContact: {type: boolean}
        readyToParticipate: {type: boolean}
